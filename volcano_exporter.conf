input {
  file {
    # Path where the bash script writes completed .ndjson files
    path => "/var/log/volcano_artifacts/incoming/*.ndjson"
    mode => "read"
    
    # Automatically move processed files to the archive folder
    
    # Process line-by-line using 64KB buffer chunks
    # file_chunk_size => 65536
    
    # Parses each line as a JSON object directly on ingest
    codec => "json"
  }
}

filter {
  # 1. Map incoming file fields to match your original pipeline variables
  mutate {
    add_field => {
      "artifact_table" => "%{source_table}"
    }
    # Move the pre-parsed artifact map into your expected [volcano][artifact] target
    rename => {
      "artifact" => "[volcano][artifact]"
    }
  }

  # Ensure table name is strictly lowercase (required for Elasticsearch Data Stream names)
  mutate {
    lowercase => [ "artifact_table" ]
  }

  # 2. Your original Ruby block: moves data to [volcano][<table_name>] dynamically
  ruby {
    code => '
      table = event.get("artifact_table")
      data = event.get("[volcano][artifact]")

      if table && data
        event.set("[volcano][#{table}]", data)
        event.remove("[volcano][artifact]")
      end
    '
  }

  # 3. Your original ECS Metadata & Data Stream definitions
  mutate {
    add_field => {
      "[ecs][version]"              => "9.4.0"
      "[event][kind]"               => "event"
      "[volcano][analyses_id]"      => "%{analysis_id}"
      "[event][module]"             => "volcano"
      "[event][dataset]"            => "volcano.%{artifact_table}"
      "[data_stream][type]"         => "logs"
      "[data_stream][dataset]"      => "volcano.%{artifact_table}"
      "[data_stream][namespace]"    => "default"
    }
  }

  # Preserve investigation_id if present in payload; avoid setting literal "%{investigation_id}"
  if [investigation_id] {
    mutate {
      add_field => { "[volcano][investigation_id]" => "%{investigation_id}" }
    }

  }

  # 4. Clean up file-input and intermediate tracking fields
  mutate {
    rename => {
      "source_table" => "[volcano][source_table]"
    }
    remove_field => [ "artifact_table", "raw_json_string", "headers", "host", "log", "analysis_id"]
  }
}
output {
    # Debugging output (Logs output to /var/log/logstash/logstash-plain.log)
    stdout { codec => rubydebug }
  }